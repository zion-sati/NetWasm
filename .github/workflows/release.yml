name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing published GitHub Release tag to retry
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: nuget-release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      infrastructure_commit: ${{ steps.release.outputs.infrastructure_commit }}
      source_commit: ${{ steps.release.outputs.source_commit }}
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      mode: ${{ steps.release.outputs.mode }}
      preview_version: ${{ steps.release.outputs.preview_version }}
      preview_tag: ${{ steps.release.outputs.preview_tag }}
      stable_version: ${{ steps.release.outputs.stable_version }}
      stable_tag: ${{ steps.release.outputs.stable_tag }}
      artifact_name: ${{ steps.release.outputs.artifact_name }}
      ci_run_id: ${{ steps.release-ci.outputs.ci_run_id }}
    steps:
      - name: Check out release infrastructure
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: infrastructure

      - name: Verify manual retry names a published release
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" \
            --jq 'if .draft then error("Release is still a draft") else .tag_name end' |
            grep -Fqx "${RELEASE_TAG}"

      - name: Check out release source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
          fetch-depth: 0
          path: source

      - name: Resolve GitHub Release
        id: release
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          git -C source fetch --force origin \
            "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}" \
            "+refs/heads/${DEFAULT_BRANCH}:refs/remotes/origin/${DEFAULT_BRANCH}"
          source_commit="$(git -C source rev-parse HEAD)"
          test "$(git -C source rev-parse "refs/tags/${RELEASE_TAG}^{commit}")" = "${source_commit}"
          git -C source merge-base --is-ancestor \
            "${source_commit}" "refs/remotes/origin/${DEFAULT_BRANCH}"
          python3 infrastructure/eng/resolve-release.py \
            --manifest infrastructure/eng/release-manifest.json \
            --tag "${RELEASE_TAG}" \
            --source-commit "${source_commit}" \
            --output artifacts/release-manifest.json \
            --train-directory artifacts/train-manifests \
            --github-output "${GITHUB_OUTPUT}"
          infrastructure_commit="$(git -C infrastructure rev-parse HEAD)"
          printf 'infrastructure_commit=%s\n' "${infrastructure_commit}" >> "${GITHUB_OUTPUT}"

      - name: Require exact-source main CI
        id: release-ci
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SOURCE_COMMIT: ${{ steps.release.outputs.source_commit }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          python3 infrastructure/eng/verify-release-ci.py \
            --repository "$GITHUB_REPOSITORY" \
            --workflow .github/workflows/ci.yml \
            --source-commit "$SOURCE_COMMIT" \
            --default-branch "$DEFAULT_BRANCH" \
            --github-output "$GITHUB_OUTPUT"

      - name: Install .NET SDK
        if: steps.release.outputs.mode == 'build'
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: source/global.json

      - name: Read pinned Node.js version
        if: steps.release.outputs.mode == 'build'
        id: toolchain
        shell: bash
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path

          manifest = json.loads(Path("source/eng/toolchain.json").read_text())
          print(f"node={manifest['node']}")
          print(f"emscripten={manifest['emscripten']}")
          print(f"wasm_tools={manifest['wasmTools']}")
          print(f"wasm_tools_linux_x64_sha256={manifest['wasmToolsLinuxX64Sha256']}")
          PY

      - name: Install Node.js
        if: steps.release.outputs.mode == 'build'
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ steps.toolchain.outputs.node }}
          package-manager-cache: false

      - name: Install pinned native toolchain
        if: steps.release.outputs.mode == 'build'
        shell: bash
        run: |
          git clone --depth 1 --branch "${{ steps.toolchain.outputs.emscripten }}" https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/emsdk"
          "$RUNNER_TEMP/emsdk/emsdk" install "${{ steps.toolchain.outputs.emscripten }}"
          "$RUNNER_TEMP/emsdk/emsdk" activate "${{ steps.toolchain.outputs.emscripten }}"
          archive="$RUNNER_TEMP/wasm-tools-${{ steps.toolchain.outputs.wasm_tools }}-x86_64-linux.tar.gz"
          curl --fail --silent --show-error --location --retry 3 --retry-all-errors \
            --output "$archive" \
            "https://github.com/bytecodealliance/wasm-tools/releases/download/v${{ steps.toolchain.outputs.wasm_tools }}/wasm-tools-${{ steps.toolchain.outputs.wasm_tools }}-x86_64-linux.tar.gz"
          printf '%s  %s\n' '${{ steps.toolchain.outputs.wasm_tools_linux_x64_sha256 }}' "$archive" | sha256sum --check --strict
          mkdir "$RUNNER_TEMP/wasm-tools"
          tar --extract --gzip --file "$archive" --directory "$RUNNER_TEMP/wasm-tools" --strip-components=1
          echo "$RUNNER_TEMP/wasm-tools" >> "$GITHUB_PATH"

      - name: Build release packages
        if: steps.release.outputs.mode == 'build'
        shell: bash
        env:
          MODE: ${{ steps.release.outputs.mode }}
          PREVIEW_VERSION: ${{ steps.release.outputs.preview_version }}
          STABLE_VERSION: ${{ steps.release.outputs.stable_version }}
        run: |
          source "$RUNNER_TEMP/emsdk/emsdk_env.sh"
          export NETWASM_TOOLCHAIN_CACHE="$RUNNER_TEMP/toolchain-cache"
          versions=("preview:$PREVIEW_VERSION" "stable:$STABLE_VERSION")
          for item in "${versions[@]}"; do
            channel="${item%%:*}"
            version="${item#*:}"
            candidate="$GITHUB_WORKSPACE/artifacts/candidates/$channel"
            mkdir -p "$candidate/packages"
            cp "artifacts/train-manifests/$channel-manifest.json" \
              "$candidate/release-manifest.json"
            bash source/eng/build-packages.sh \
              --version "$version" \
              --output "$candidate/packages"
          done

      - name: Retain neutral release packages
        if: steps.release.outputs.mode == 'build'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: netwasm-neutral-${{ steps.release.outputs.stable_version }}
          path: artifacts/
          compression-level: 0
          if-no-files-found: error
          retention-days: 90
          overwrite: true

  host-tools:
    needs: build
    if: needs.build.outputs.mode == 'build'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            rid: linux-x64
          - runner: ubuntu-24.04-arm
            rid: linux-arm64
          - runner: macos-14
            rid: osx-arm64
          - runner: windows-2025
            rid: win-x64
          - runner: windows-11-vs2026-arm
            rid: win-arm64
    steps:
      - name: Check out release source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.build.outputs.tag }}
          fetch-depth: 0
          path: source
      - name: Verify source revision
        shell: bash
        run: |
          test "$(git -C source rev-parse HEAD)" = "${{ needs.build.outputs.source_commit }}"
      - name: Install .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: source/global.json
      - name: Install Python for package production
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.13'
      - name: Install pinned Linux Node patcher
        if: startsWith(matrix.rid, 'linux-')
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y patchelf=0.18.0-1.1build1
      - name: Build pinned native package
        shell: bash
        env:
          NETWASM_GITHUB_TOKEN: ${{ github.token }}
          MODE: ${{ needs.build.outputs.mode }}
          PREVIEW_VERSION: ${{ needs.build.outputs.preview_version }}
          STABLE_VERSION: ${{ needs.build.outputs.stable_version }}
        run: |
          versions=(--version "$STABLE_VERSION")
          if [[ "$MODE" == "build" ]]; then
            versions=(--version "$PREVIEW_VERSION" --version "$STABLE_VERSION")
          fi
          python source/eng/build-host-tools-package.py \
            --rid "${{ matrix.rid }}" \
            "${versions[@]}" \
            --output "$RUNNER_TEMP/host-packages" \
            --cache "$RUNNER_TEMP/host-tools-inputs"
      - name: Retain host package
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: host-tools-${{ matrix.rid }}
          path: ${{ runner.temp }}/host-packages/*.nupkg
          compression-level: 0
          if-no-files-found: error
          retention-days: 90
          overwrite: true

  aggregate:
    needs: [build, host-tools]
    if: >-
      ${{ always() && needs.build.result == 'success' &&
          ((needs.build.outputs.mode == 'build' && needs.host-tools.result == 'success') ||
           (needs.build.outputs.mode == 'promote' && needs.host-tools.result == 'skipped')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      actions: read
      contents: write
    steps:
      - name: Check out release infrastructure
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.build.outputs.infrastructure_commit }}
          path: infrastructure
      - name: Check out release source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.build.outputs.tag }}
          fetch-depth: 0
          path: source
      - name: Download neutral release packages
        if: needs.build.outputs.mode == 'build'
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: netwasm-neutral-${{ needs.build.outputs.stable_version }}
          path: artifacts
      - name: Download all native packages
        if: needs.build.outputs.mode == 'build'
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: host-tools-*
          merge-multiple: true
          path: artifacts/host-packages
      - name: Verify complete release set and source
        if: needs.build.outputs.mode == 'build'
        shell: bash
        env:
          PREVIEW_VERSION: ${{ needs.build.outputs.preview_version }}
          PREVIEW_TAG: ${{ needs.build.outputs.preview_tag }}
          STABLE_VERSION: ${{ needs.build.outputs.stable_version }}
          STABLE_TAG: ${{ needs.build.outputs.stable_tag }}
          ARTIFACT_NAME: ${{ needs.build.outputs.artifact_name }}
        run: |
          channels=("preview:$PREVIEW_VERSION" "stable:$STABLE_VERSION")
          mkdir -p artifacts/train
          for item in "${channels[@]}"; do
            channel="${item%%:*}"
            version="${item#*:}"
            candidate="artifacts/candidates/$channel"
            find artifacts/host-packages -maxdepth 1 -type f \
              -name "NetWasm.HostTools.*.$version.nupkg" \
              -exec cp {} "$candidate/packages/" \;
            python3 infrastructure/eng/verify-release-packages.py \
              --manifest "$candidate/release-manifest.json" \
              --packages "$candidate/packages" \
              --source-root source \
              --allowed-signers infrastructure/eng/release-signers \
              --receipt "$candidate/release-package-receipt.json"
            python3 infrastructure/eng/release-train.py bundle \
              --manifest "$candidate/release-manifest.json" \
              --receipt "$candidate/release-package-receipt.json" \
              --packages "$candidate/packages" \
              --output "artifacts/train/netwasm-$channel-$version.zip"
          done
          python3 infrastructure/eng/release-train.py create \
            --repository "$GITHUB_REPOSITORY" \
            --source-commit "${{ needs.build.outputs.source_commit }}" \
            --producing-tag "$PREVIEW_TAG" \
            --preview-tag "$PREVIEW_TAG" \
            --stable-tag "$STABLE_TAG" \
            --run-id "$GITHUB_RUN_ID" \
            --artifact-name "$ARTIFACT_NAME" \
            --preview-bundle "artifacts/train/netwasm-preview-$PREVIEW_VERSION.zip" \
            --stable-bundle "artifacts/train/netwasm-stable-$STABLE_VERSION.zip" \
            --toolchain source/eng/toolchain.json \
            --output "artifacts/train/$ARTIFACT_NAME.json"
      - name: Retain verified preview and stable train
        if: needs.build.outputs.mode == 'build'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ${{ needs.build.outputs.artifact_name }}
          path: artifacts/train/
          compression-level: 0
          if-no-files-found: error
          retention-days: 90
          overwrite: true
      - name: Bind retained train manifest to preview GitHub Release
        if: needs.build.outputs.mode == 'build'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.build.outputs.preview_tag }}
          ASSET_NAME: ${{ needs.build.outputs.artifact_name }}.json
        run: |
          existing="$RUNNER_TEMP/existing-release-assets"
          mkdir -p "$existing"
          asset="artifacts/train/$ASSET_NAME"
          if gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
              --pattern "$ASSET_NAME" --dir "$existing" >/dev/null 2>&1; then
            cmp --silent "$asset" "$existing/$ASSET_NAME" || {
              echo "Published release-train manifest differs from this run." >&2
              exit 1
            }
          else
            gh release upload "$RELEASE_TAG" "$asset" --repo "$GITHUB_REPOSITORY"
          fi
      - name: Resolve retained release train coordinates
        if: needs.build.outputs.mode == 'promote'
        id: retained-train
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIEW_TAG: ${{ needs.build.outputs.preview_tag }}
          STABLE_TAG: ${{ needs.build.outputs.stable_tag }}
          SOURCE_COMMIT: ${{ needs.build.outputs.source_commit }}
          ARTIFACT_NAME: ${{ needs.build.outputs.artifact_name }}
        run: |
          retained="artifacts/retained-train"
          mkdir -p "$retained"
          gh release download "$PREVIEW_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "$ARTIFACT_NAME.json" \
            --dir "$retained"
          python3 infrastructure/eng/release-train.py identity \
            --train "$retained/$ARTIFACT_NAME.json" \
            --repository "$GITHUB_REPOSITORY" \
            --source-commit "$SOURCE_COMMIT" \
            --producing-tag "$PREVIEW_TAG" \
            --preview-tag "$PREVIEW_TAG" \
            --stable-tag "$STABLE_TAG" \
            --artifact-name "$ARTIFACT_NAME" \
            --github-output "$GITHUB_OUTPUT"
      - name: Resolve and verify retained stable candidate
        if: needs.build.outputs.mode == 'promote'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          STABLE_TAG: ${{ needs.build.outputs.stable_tag }}
          STABLE_VERSION: ${{ needs.build.outputs.stable_version }}
          SOURCE_COMMIT: ${{ needs.build.outputs.source_commit }}
          ARTIFACT_NAME: ${{ needs.build.outputs.artifact_name }}
        run: |
          retained="artifacts/retained-train"
          downloaded="artifacts/downloaded-train"
          candidate="artifacts/candidates/stable"
          mkdir -p "$downloaded"
          train="$retained/$ARTIFACT_NAME.json"
          gh run download "${{ steps.retained-train.outputs.producing_run_id }}" \
            --repo "$GITHUB_REPOSITORY" \
            --name "${{ steps.retained-train.outputs.artifact_name }}" \
            --dir "$downloaded"
          cmp --silent "$train" "$downloaded/$ARTIFACT_NAME.json"
          bundle="$downloaded/netwasm-stable-$STABLE_VERSION.zip"
          python3 infrastructure/eng/release-train.py verify \
            --train "$train" \
            --bundle "$bundle" \
            --channel stable \
            --repository "$GITHUB_REPOSITORY" \
            --source-commit "$SOURCE_COMMIT" \
            --release-tag "$STABLE_TAG"
          python3 infrastructure/eng/release-train.py extract \
            --bundle "$bundle" \
            --output "$candidate"
          python3 infrastructure/eng/resolve-release.py \
            --manifest infrastructure/eng/release-manifest.json \
            --tag "$STABLE_TAG" \
            --source-commit "$SOURCE_COMMIT" \
            --output "$candidate/release-manifest.json"
          python3 infrastructure/eng/verify-release-packages.py \
            --manifest "$candidate/release-manifest.json" \
            --packages "$candidate/packages" \
            --source-root source \
            --allowed-signers infrastructure/eng/release-signers \
            --receipt "$candidate/release-package-receipt.json" \
            --timing-output "$candidate/local-verification.json"
          (cd "$candidate" && sha256sum packages/*.nupkg > SHA256SUMS)
      - name: Retain stable promotion artifacts
        if: needs.build.outputs.mode == 'promote'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: netwasm-${{ needs.build.outputs.stable_version }}
          path: artifacts/candidates/stable/
          compression-level: 0
          if-no-files-found: error
          retention-days: 90
          overwrite: true

  publish:
    needs: [build, aggregate]
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    environment: nuget-release
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - name: Check out release infrastructure
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.build.outputs.infrastructure_commit }}
          path: infrastructure

      - name: Check out release source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.build.outputs.tag }}
          fetch-depth: 0
          path: source

      - name: Install pinned .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: source/global.json

      - name: Download preview/stable release train
        if: needs.build.outputs.mode == 'build'
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: ${{ needs.build.outputs.artifact_name }}
          path: artifacts/train

      - name: Download verified stable promotion artifacts
        if: needs.build.outputs.mode == 'promote'
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: netwasm-${{ needs.build.outputs.stable_version }}
          path: artifacts/publish

      - name: Select preview candidate from release train
        if: needs.build.outputs.mode == 'build'
        shell: bash
        run: |
          train="artifacts/train/${{ needs.build.outputs.artifact_name }}.json"
          bundle="artifacts/train/netwasm-preview-${{ needs.build.outputs.preview_version }}.zip"
          python3 infrastructure/eng/release-train.py verify \
            --train "$train" \
            --bundle "$bundle" \
            --channel preview \
            --repository "$GITHUB_REPOSITORY" \
            --source-commit "${{ needs.build.outputs.source_commit }}" \
            --release-tag "${{ needs.build.outputs.preview_tag }}"
          python3 infrastructure/eng/release-train.py extract \
            --bundle "$bundle" \
            --output artifacts/publish

      - name: Verify release identity
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
          SOURCE_COMMIT: ${{ needs.build.outputs.source_commit }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          manifest = json.loads(Path("artifacts/publish/release-manifest.json").read_text())
          expected = {
              "releaseTag": os.environ["RELEASE_TAG"],
              "releaseVersion": os.environ["VERSION"],
              "sourceCommit": os.environ["SOURCE_COMMIT"],
          }
          for name, value in expected.items():
              if manifest[name] != value:
                  raise SystemExit(f"Release artifact {name} does not match the GitHub Release.")
          PY

      - name: Revalidate release artifacts
        shell: bash
        run: |
          mkdir -p artifacts/publish/timings
          python3 infrastructure/eng/verify-release-packages.py \
            --manifest artifacts/publish/release-manifest.json \
            --packages artifacts/publish/packages \
            --source-root source \
            --allowed-signers infrastructure/eng/release-signers \
            --receipt artifacts/publish/publish-package-receipt.json \
            --timing-output artifacts/publish/timings/local-verification.json

      - name: Reconcile NuGet state before requesting credentials
        shell: bash
        run: |
          cd source
          python3 ../infrastructure/eng/publish-release-packages.py \
            --manifest ../artifacts/publish/release-manifest.json \
            --packages ../artifacts/publish/packages \
            --preflight \
            --timing-output ../artifacts/publish/timings/feed-preflight.json

      - name: Request credential for prerequisites
        id: login_prerequisites
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Publish and verify prerequisites
        shell: bash
        env:
          NUGET_API_KEY: ${{ steps.login_prerequisites.outputs.NUGET_API_KEY }}
        run: |
          cd source
          python3 ../infrastructure/eng/publish-release-packages.py \
            --manifest ../artifacts/publish/release-manifest.json \
            --packages ../artifacts/publish/packages \
            --stage prerequisites \
            --timing-output ../artifacts/publish/timings/prerequisites.json

      - name: Request credential for final wave
        id: login_final
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Publish and verify SDK and templates
        shell: bash
        env:
          NUGET_API_KEY: ${{ steps.login_final.outputs.NUGET_API_KEY }}
        run: |
          cd source
          python3 ../infrastructure/eng/publish-release-packages.py \
            --manifest ../artifacts/publish/release-manifest.json \
            --packages ../artifacts/publish/packages \
            --stage final \
            --timing-output ../artifacts/publish/timings/final.json

      - name: Retain release timing evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: netwasm-release-timings-${{ needs.build.outputs.version }}
          path: artifacts/publish/timings/
          if-no-files-found: warn
          retention-days: 90
          overwrite: true
