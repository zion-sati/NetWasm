name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing published GitHub Release tag to retry
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: nuget-release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      infrastructure_commit: ${{ steps.release.outputs.infrastructure_commit }}
      source_commit: ${{ steps.release.outputs.source_commit }}
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Check out release infrastructure
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: infrastructure

      - name: Verify manual retry names a published release
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" \
            --jq 'if .draft then error("Release is still a draft") else .tag_name end' |
            grep -Fqx "${RELEASE_TAG}"

      - name: Check out release source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
          fetch-depth: 0
          path: source

      - name: Resolve GitHub Release
        id: release
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          git -C source fetch --force origin \
            "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}" \
            "+refs/heads/${DEFAULT_BRANCH}:refs/remotes/origin/${DEFAULT_BRANCH}"
          source_commit="$(git -C source rev-parse HEAD)"
          test "$(git -C source rev-parse "refs/tags/${RELEASE_TAG}^{commit}")" = "${source_commit}"
          git -C source merge-base --is-ancestor \
            "${source_commit}" "refs/remotes/origin/${DEFAULT_BRANCH}"
          python3 infrastructure/eng/resolve-release.py \
            --manifest infrastructure/eng/release-manifest.json \
            --tag "${RELEASE_TAG}" \
            --source-commit "${source_commit}" \
            --output artifacts/release-manifest.json \
            --github-output "${GITHUB_OUTPUT}"
          infrastructure_commit="$(git -C infrastructure rev-parse HEAD)"
          printf 'infrastructure_commit=%s\n' "${infrastructure_commit}" >> "${GITHUB_OUTPUT}"

      - name: Install .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: source/global.json

      - name: Read pinned Node.js version
        id: toolchain
        shell: bash
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path

          manifest = json.loads(Path("source/eng/toolchain.json").read_text())
          print(f"node={manifest['node']}")
          print(f"emscripten={manifest['emscripten']}")
          print(f"wasm_tools={manifest['wasmTools']}")
          print(f"wasm_tools_linux_x64_sha256={manifest['wasmToolsLinuxX64Sha256']}")
          PY

      - name: Install Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ steps.toolchain.outputs.node }}
          package-manager-cache: false

      - name: Install pinned native toolchain
        shell: bash
        run: |
          git clone --depth 1 --branch "${{ steps.toolchain.outputs.emscripten }}" https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/emsdk"
          "$RUNNER_TEMP/emsdk/emsdk" install "${{ steps.toolchain.outputs.emscripten }}"
          "$RUNNER_TEMP/emsdk/emsdk" activate "${{ steps.toolchain.outputs.emscripten }}"
          archive="$RUNNER_TEMP/wasm-tools-${{ steps.toolchain.outputs.wasm_tools }}-x86_64-linux.tar.gz"
          curl --fail --silent --show-error --location --retry 3 --retry-all-errors \
            --output "$archive" \
            "https://github.com/bytecodealliance/wasm-tools/releases/download/v${{ steps.toolchain.outputs.wasm_tools }}/wasm-tools-${{ steps.toolchain.outputs.wasm_tools }}-x86_64-linux.tar.gz"
          printf '%s  %s\n' '${{ steps.toolchain.outputs.wasm_tools_linux_x64_sha256 }}' "$archive" | sha256sum --check --strict
          mkdir "$RUNNER_TEMP/wasm-tools"
          tar --extract --gzip --file "$archive" --directory "$RUNNER_TEMP/wasm-tools" --strip-components=1
          echo "$RUNNER_TEMP/wasm-tools" >> "$GITHUB_PATH"

      - name: Build release packages
        shell: bash
        run: |
          source "$RUNNER_TEMP/emsdk/emsdk_env.sh"
          bash source/eng/build-packages.sh \
            --version "${{ steps.release.outputs.version }}" \
            --output "$GITHUB_WORKSPACE/artifacts/packages"

      - name: Retain neutral release packages
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: netwasm-neutral-${{ steps.release.outputs.version }}
          path: artifacts/
          compression-level: 0
          if-no-files-found: error
          retention-days: 7

  host-tools:
    needs: build
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            rid: linux-x64
          - runner: ubuntu-24.04-arm
            rid: linux-arm64
          - runner: macos-14
            rid: osx-arm64
          - runner: windows-2025
            rid: win-x64
          - runner: windows-11-vs2026-arm
            rid: win-arm64
    steps:
      - name: Check out release source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.build.outputs.tag }}
          fetch-depth: 0
          path: source
      - name: Verify source revision
        shell: bash
        run: |
          test "$(git -C source rev-parse HEAD)" = "${{ needs.build.outputs.source_commit }}"
      - name: Install .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: source/global.json
      - name: Install Python for package production
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.13'
      - name: Install pinned Linux Node patcher
        if: startsWith(matrix.rid, 'linux-')
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y patchelf=0.18.0-1.1build1
      - name: Build pinned native package
        shell: bash
        run: |
          python source/eng/build-host-tools-package.py \
            --rid "${{ matrix.rid }}" \
            --version "${{ needs.build.outputs.version }}" \
            --output "$RUNNER_TEMP/host-packages" \
            --cache "$RUNNER_TEMP/host-tools-inputs"
      - name: Retain host package
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: host-tools-${{ matrix.rid }}
          path: ${{ runner.temp }}/host-packages/*.nupkg
          compression-level: 0
          if-no-files-found: error
          retention-days: 7

  aggregate:
    needs: [build, host-tools]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out release infrastructure
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.build.outputs.infrastructure_commit }}
          path: infrastructure
      - name: Check out release source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.build.outputs.tag }}
          fetch-depth: 0
          path: source
      - name: Download neutral release packages
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: netwasm-neutral-${{ needs.build.outputs.version }}
          path: artifacts
      - name: Download all native packages
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: host-tools-*
          merge-multiple: true
          path: artifacts/packages
      - name: Verify complete release set and source
        shell: bash
        run: |
          python3 infrastructure/eng/verify-release-packages.py \
            --manifest artifacts/release-manifest.json \
            --packages artifacts/packages \
            --source-root source \
            --allowed-signers infrastructure/eng/release-signers \
            --receipt artifacts/release-package-receipt.json
          (cd artifacts && sha256sum packages/*.nupkg > SHA256SUMS)
      - name: Retain verified release artifacts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: netwasm-${{ needs.build.outputs.version }}
          path: artifacts/
          compression-level: 0
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [build, aggregate]
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    environment: nuget-release
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out release infrastructure
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.build.outputs.infrastructure_commit }}
          path: infrastructure

      - name: Check out release source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.build.outputs.tag }}
          fetch-depth: 0
          path: source

      - name: Install pinned .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: source/global.json

      - name: Download release artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: netwasm-${{ needs.build.outputs.version }}
          path: artifacts

      - name: Verify release identity
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
          SOURCE_COMMIT: ${{ needs.build.outputs.source_commit }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          manifest = json.loads(Path("artifacts/release-manifest.json").read_text())
          expected = {
              "releaseTag": os.environ["RELEASE_TAG"],
              "releaseVersion": os.environ["VERSION"],
              "sourceCommit": os.environ["SOURCE_COMMIT"],
          }
          for name, value in expected.items():
              if manifest[name] != value:
                  raise SystemExit(f"Release artifact {name} does not match the GitHub Release.")
          PY

      - name: Revalidate release artifacts
        shell: bash
        run: |
          (cd artifacts && sha256sum --check SHA256SUMS)
          python3 infrastructure/eng/verify-release-packages.py \
            --manifest artifacts/release-manifest.json \
            --packages artifacts/packages \
            --source-root source \
            --allowed-signers infrastructure/eng/release-signers \
            --receipt artifacts/publish-package-receipt.json

      - name: Request credential for prerequisites
        id: login_prerequisites
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Publish and verify prerequisites
        shell: bash
        env:
          NUGET_API_KEY: ${{ steps.login_prerequisites.outputs.NUGET_API_KEY }}
        run: |
          cd source
          python3 ../infrastructure/eng/publish-release-packages.py \
            --manifest ../artifacts/release-manifest.json \
            --packages ../artifacts/packages \
            --stage prerequisites

      - name: Request credential for SDK
        id: login_sdk
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Publish and verify SDK
        shell: bash
        env:
          NUGET_API_KEY: ${{ steps.login_sdk.outputs.NUGET_API_KEY }}
        run: |
          cd source
          python3 ../infrastructure/eng/publish-release-packages.py \
            --manifest ../artifacts/release-manifest.json \
            --packages ../artifacts/packages \
            --stage SDK

      - name: Request credential for templates
        id: login_templates
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Publish and verify templates
        shell: bash
        env:
          NUGET_API_KEY: ${{ steps.login_templates.outputs.NUGET_API_KEY }}
        run: |
          cd source
          python3 ../infrastructure/eng/publish-release-packages.py \
            --manifest ../artifacts/release-manifest.json \
            --packages ../artifacts/packages \
            --stage templates
