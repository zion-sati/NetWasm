name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing published GitHub Release tag to retry
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: nuget-release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      infrastructure_commit: ${{ steps.release.outputs.infrastructure_commit }}
      source_commit: ${{ steps.release.outputs.source_commit }}
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Check out release infrastructure
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: infrastructure

      - name: Verify manual retry names a published release
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" \
            --jq 'if .draft then error("Release is still a draft") else .tag_name end' |
            grep -Fqx "${RELEASE_TAG}"

      - name: Check out release source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
          fetch-depth: 0
          path: source

      - name: Resolve GitHub Release
        id: release
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          git -C source fetch --force origin \
            "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}" \
            "+refs/heads/${DEFAULT_BRANCH}:refs/remotes/origin/${DEFAULT_BRANCH}"
          source_commit="$(git -C source rev-parse HEAD)"
          test "$(git -C source rev-parse "refs/tags/${RELEASE_TAG}^{commit}")" = "${source_commit}"
          git -C source merge-base --is-ancestor \
            "${source_commit}" "refs/remotes/origin/${DEFAULT_BRANCH}"
          python3 infrastructure/eng/resolve-release.py \
            --manifest infrastructure/eng/release-manifest.json \
            --tag "${RELEASE_TAG}" \
            --source-commit "${source_commit}" \
            --output artifacts/release-manifest.json \
            --github-output "${GITHUB_OUTPUT}"
          infrastructure_commit="$(git -C infrastructure rev-parse HEAD)"
          printf 'infrastructure_commit=%s\n' "${infrastructure_commit}" >> "${GITHUB_OUTPUT}"

      - name: Install .NET SDK
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: source/global.json

      - name: Read pinned Node.js version
        id: toolchain
        shell: bash
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path

          manifest = json.loads(Path("source/eng/toolchain.json").read_text())
          print(f"node={manifest['node']}")
          print(f"emscripten={manifest['emscripten']}")
          print(f"wasm_tools={manifest['wasmTools']}")
          print(f"wasm_tools_linux_x64_sha256={manifest['wasmToolsLinuxX64Sha256']}")
          PY

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ steps.toolchain.outputs.node }}
          package-manager-cache: false

      - name: Install pinned native toolchain
        shell: bash
        run: |
          git clone --depth 1 --branch "${{ steps.toolchain.outputs.emscripten }}" https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/emsdk"
          "$RUNNER_TEMP/emsdk/emsdk" install "${{ steps.toolchain.outputs.emscripten }}"
          "$RUNNER_TEMP/emsdk/emsdk" activate "${{ steps.toolchain.outputs.emscripten }}"
          archive="$RUNNER_TEMP/wasm-tools-${{ steps.toolchain.outputs.wasm_tools }}-x86_64-linux.tar.gz"
          curl --fail --silent --show-error --location --retry 3 --retry-all-errors \
            --output "$archive" \
            "https://github.com/bytecodealliance/wasm-tools/releases/download/v${{ steps.toolchain.outputs.wasm_tools }}/wasm-tools-${{ steps.toolchain.outputs.wasm_tools }}-x86_64-linux.tar.gz"
          printf '%s  %s\n' '${{ steps.toolchain.outputs.wasm_tools_linux_x64_sha256 }}' "$archive" | sha256sum --check --strict
          mkdir "$RUNNER_TEMP/wasm-tools"
          tar --extract --gzip --file "$archive" --directory "$RUNNER_TEMP/wasm-tools" --strip-components=1
          echo "$RUNNER_TEMP/wasm-tools" >> "$GITHUB_PATH"

      - name: Build release packages
        shell: bash
        run: |
          source "$RUNNER_TEMP/emsdk/emsdk_env.sh"
          bash source/eng/build-packages.sh \
            --version "${{ steps.release.outputs.version }}" \
            --output "$GITHUB_WORKSPACE/artifacts/packages"

      - name: Validate release packages
        shell: bash
        run: |
          python3 infrastructure/eng/verify-release-packages.py \
            --manifest artifacts/release-manifest.json \
            --packages artifacts/packages \
            --source-root source \
            --allowed-signers infrastructure/eng/release-signers \
            --receipt artifacts/release-package-receipt.json
          (cd artifacts && sha256sum packages/*.nupkg > SHA256SUMS)

      - name: Retain release artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: netwasm-${{ steps.release.outputs.version }}
          path: artifacts/
          compression-level: 0
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: nuget-release
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out release infrastructure
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.build.outputs.infrastructure_commit }}
          path: infrastructure

      - name: Download release artifacts
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: netwasm-${{ needs.build.outputs.version }}
          path: artifacts

      - name: Verify release identity
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
          SOURCE_COMMIT: ${{ needs.build.outputs.source_commit }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          manifest = json.loads(Path("artifacts/release-manifest.json").read_text())
          expected = {
              "releaseTag": os.environ["RELEASE_TAG"],
              "releaseVersion": os.environ["VERSION"],
              "sourceCommit": os.environ["SOURCE_COMMIT"],
          }
          for name, value in expected.items():
              if manifest[name] != value:
                  raise SystemExit(f"Release artifact {name} does not match the GitHub Release.")
          PY

      - name: Revalidate artifacts and NuGet.org identity availability
        shell: bash
        run: |
          (cd artifacts && sha256sum --check SHA256SUMS)
          python3 infrastructure/eng/verify-release-packages.py \
            --manifest artifacts/release-manifest.json \
            --packages artifacts/packages \
            --receipt artifacts/publish-package-receipt.json \
            --require-absent-on-nuget

      - name: Request temporary NuGet.org credential
        id: login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Publish packages
        shell: bash
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          while IFS= read -r package; do
            dotnet nuget push "$package" \
              --api-key "$NUGET_API_KEY" \
              --source https://api.nuget.org/v3/index.json
          done < <(find artifacts/packages -maxdepth 1 -type f -name '*.nupkg' | LC_ALL=C sort)
