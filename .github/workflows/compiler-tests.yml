name: Compiler tests

# The compiler test shards that CI and the release workflow share. CI narrows the
# corpus to the Fast profile and the tests to the pull request tier; the release
# leaves both empty, so every compiler test runs and every corpus fixture runs its
# declared matrix, as eng/test.sh does.
on:
  workflow_call:
    inputs:
      ref:
        description: Commit or tag to test; empty tests the calling run's commit.
        type: string
        default: ''
      corpus-profile:
        description: NETWASM_CORPUS_PROFILE for every shard; empty keeps each fixture's declared matrix.
        type: string
        default: ''
      shards:
        description: JSON array numbering the shards, one job each.
        type: string
        required: true
      timings:
        description: Compiler test timing history that balances the shards.
        type: string
        required: true
      classes:
        description: File listing the test classes to run, one per line; empty runs every compiler test.
        type: string
        default: ''
      coverage:
        description: Collect each shard's Coverlet JSON report as an artifact.
        type: boolean
        default: false
      timeout-minutes:
        type: number
        required: true
      artifact-prefix:
        description: Prefix of each shard's TRX artifact.
        type: string
        required: true

jobs:
  shard:
    name: compiler ${{ matrix.shard }} of ${{ strategy.job-total }}
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ inputs.timeout-minutes }}
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(inputs.shards) }}
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - name: Install .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json

      - name: Read pinned .NET 11 SDK
        id: csharp15
        shell: bash
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          print(f"sdk={json.loads(Path('eng/csharp15-toolchain.json').read_text())['sdk11Version']}")
          PY

      - name: Install pinned .NET 11 SDK for C# 15 fixtures
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: ${{ steps.csharp15.outputs.sdk }}

      - name: Read pinned Node.js version
        id: toolchain
        shell: bash
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path

          manifest = json.loads(Path("eng/toolchain.json").read_text())
          print(f"node={manifest['node']}")
          print(f"emscripten={manifest['emscripten']}")
          PY

      - name: Install Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ steps.toolchain.outputs.node }}
          package-manager-cache: false

      - name: Install pinned Emscripten
        shell: bash
        run: |
          git clone --depth 1 --branch "${{ steps.toolchain.outputs.emscripten }}" https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/emsdk"
          "$RUNNER_TEMP/emsdk/emsdk" install "${{ steps.toolchain.outputs.emscripten }}"
          "$RUNNER_TEMP/emsdk/emsdk" activate "${{ steps.toolchain.outputs.emscripten }}"

      - name: Install pinned wasm-tools
        shell: bash
        run: |
          archive="$RUNNER_TEMP/wasm-tools-1.256.0-x86_64-linux.tar.gz"
          curl --fail --silent --show-error --location \
            --retry 3 --retry-all-errors \
            --output "$archive" \
            https://github.com/bytecodealliance/wasm-tools/releases/download/v1.256.0/wasm-tools-1.256.0-x86_64-linux.tar.gz
          printf '%s  %s\n' \
            '0b488be25c9e8a74dfa09f7eac614a927ea197f389d8fa5a21ffb1c15deb469d' \
            "$archive" | sha256sum --check --strict
          mkdir "$RUNNER_TEMP/wasm-tools"
          tar --extract --gzip --file "$archive" \
            --directory "$RUNNER_TEMP/wasm-tools" \
            --strip-components=1
          echo "$RUNNER_TEMP/wasm-tools" >> "$GITHUB_PATH"

      - name: Prepare compiler qualification inputs
        shell: bash
        run: bash eng/prepare-compiler-qualification-inputs.sh "$RUNNER_TEMP/compiler-qualification"

      - name: Build compiler test binaries
        shell: bash
        env:
          CORPUS_PROFILE: ${{ inputs.corpus-profile }}
          NETWASM_CORPUS_RECEIPTS: ${{ runner.temp }}/compiler-qualification/linked-receipts
          NETWASM_COMPATIBILITY_REFERENCE_ROOT: ${{ runner.temp }}/compiler-qualification/compatibility-references
          NETWASM_EMSDK_ROOT: ${{ runner.temp }}/emsdk
          NETWASM_WASM_TOOLS_PATH: ${{ runner.temp }}/wasm-tools/wasm-tools
        run: |
          source "$RUNNER_TEMP/emsdk/emsdk_env.sh"
          export PATH="$RUNNER_TEMP/emsdk/upstream/bin:$PATH"
          if [[ -n "$CORPUS_PROFILE" ]]; then
            export NETWASM_CORPUS_PROFILE="$CORPUS_PROFILE"
          fi
          NETWASM_NODE_PATH="$(command -v node)"
          export NETWASM_NODE_PATH
          npm ci --ignore-scripts --no-audit --no-fund
          bash eng/verify-toolchain.sh
          bash src/NetWasm.Runtime.Pack/tools/regenerate-runtime-pack.sh --allow-emscripten
          project=tests/NetWasm.Compiler.Tests/NetWasm.Compiler.Tests.csproj
          corelib_project=src/NetWasm.CoreLib/NetWasm.CoreLib.csproj
          timezone_project=tools/NetWasm.TimeZones/NetWasm.TimeZones.csproj
          dotnet restore "$project" --disable-build-servers --nologo
          dotnet restore "$corelib_project" --disable-build-servers --nologo
          dotnet restore "$timezone_project" --disable-build-servers --nologo
          dotnet build "$project" -c Release --no-restore \
            --disable-build-servers --nologo
          dotnet build "$corelib_project" -c Release --no-restore \
            --disable-build-servers --nologo
          dotnet build "$timezone_project" -c Release --no-restore \
            --disable-build-servers --nologo
          NETWASM_TIMEZONE_ASSET_PATH="$(
            bash eng/prepare-timezone-test-asset.sh "$RUNNER_TEMP/timezone-assets"
          )"
          echo "NETWASM_TIMEZONE_ASSET_PATH=$NETWASM_TIMEZONE_ASSET_PATH" >> "$GITHUB_ENV"
      - name: Execute compiler shard
        shell: bash
        env:
          CORPUS_PROFILE: ${{ inputs.corpus-profile }}
          TEST_CLASSES: ${{ inputs.classes }}
          COVERAGE: ${{ inputs.coverage }}
          NETWASM_CORPUS_RECEIPTS: ${{ runner.temp }}/compiler-qualification/linked-receipts
          NETWASM_COMPATIBILITY_REFERENCE_ROOT: ${{ runner.temp }}/compiler-qualification/compatibility-references
          NETWASM_EMSDK_ROOT: ${{ runner.temp }}/emsdk
          NETWASM_WASM_TOOLS_PATH: ${{ runner.temp }}/wasm-tools/wasm-tools
        run: |
          source "$RUNNER_TEMP/emsdk/emsdk_env.sh"
          export PATH="$RUNNER_TEMP/emsdk/upstream/bin:$PATH"
          if [[ -n "$CORPUS_PROFILE" ]]; then
            export NETWASM_CORPUS_PROFILE="$CORPUS_PROFILE"
          fi
          NETWASM_NODE_PATH="$(command -v node)"
          export NETWASM_NODE_PATH
          project=tests/NetWasm.Compiler.Tests/NetWasm.Compiler.Tests.csproj
          listing="$RUNNER_TEMP/compiler-tests.list"
          dotnet test "$project" -c Release --no-build --no-restore \
            --disable-build-servers --nologo --list-tests > "$listing"
          selection=()
          if [[ -n "$TEST_CLASSES" ]]; then
            selection=(--classes "$TEST_CLASSES")
          fi
          filter="$(
            python3 eng/create-compiler-test-shard-filter.py "$listing" \
              --shard-count '${{ strategy.job-total }}' \
              --shard-index '${{ strategy.job-index }}' \
              --timings '${{ inputs.timings }}' "${selection[@]}"
          )"
          collection=()
          if [[ "$COVERAGE" == true ]]; then
            collection=(--collect "XPlat Code Coverage" --
              DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=json)
          fi
          dotnet test "$project" -c Release --no-build --no-restore \
            --disable-build-servers --nologo --filter "$filter" \
            --results-directory "$RUNNER_TEMP/compiler-test-results" \
            --logger "trx;LogFileName=compiler-${{ strategy.job-index }}.trx" "${collection[@]}"
          if [[ "$COVERAGE" == true && '${{ strategy.job-index }}' == 0 ]]; then
            # The other compiler test projects complete the coverage baseline, as in eng/test.sh.
            units="$RUNNER_TEMP/compiler-test-results/units/coverage.json"
            for unit in Core Metadata Browser ControlFlow GarbageCollection Wasm ComponentModel Cli Tasks; do
              arguments=(-c Release --disable-build-servers --nologo --filter Category!=Performance /p:CollectCoverage=true
                /p:CoverletOutput="$units" /p:CoverletOutputFormat=json)
              if [[ -f "$units" ]]; then
                arguments+=(/p:MergeWith="$units")
              fi
              dotnet test "tests/NetWasm.Compiler.$unit.Tests/NetWasm.Compiler.$unit.Tests.csproj" "${arguments[@]}"
            done
          fi
      - name: Retain compiler test timings
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ${{ inputs.artifact-prefix }}-${{ strategy.job-index }}
          path: ${{ runner.temp }}/compiler-test-results/*.trx
          if-no-files-found: warn
          retention-days: 14
      - name: Retain compiler test coverage
        if: inputs.coverage
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ${{ inputs.artifact-prefix }}-coverage-${{ strategy.job-index }}
          path: ${{ runner.temp }}/compiler-test-results/*/coverage.json
          if-no-files-found: error
          retention-days: 14
