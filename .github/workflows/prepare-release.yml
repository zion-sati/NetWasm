name: Prepare Release Train

on:
  workflow_dispatch:
    inputs:
      version:
        description: Stable semantic version for the complete release train
        required: true
        type: string

run-name: Prepare release train ${{ inputs.version }}

permissions:
  contents: read

concurrency:
  group: prepare-release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out release infrastructure
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Create narrow release App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: zion-sati
          repositories: |
            NetWasm
            TUnit-NetWasm
            NetWasm.Libraries
            NetWasm.Playground
            netwasm.com

      - name: Resolve reviewed public heads
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          repositories = (
              "zion-sati/NetWasm",
              "zion-sati/TUnit-NetWasm",
              "zion-sati/NetWasm.Libraries",
              "zion-sati/NetWasm.Playground",
              "zion-sati/netwasm.com",
          )

          def gh(path):
              result = subprocess.run(
                  ["gh", "api", path],
                  check=True,
                  capture_output=True,
                  text=True,
              )
              return json.loads(result.stdout)

          coordinates = {}
          for repository in repositories:
              metadata = gh(f"repos/{repository}")
              branch = metadata["default_branch"]
              commit = gh(f"repos/{repository}/commits/{branch}")["sha"]
              coordinates[repository] = {
                  "sourceCommit": commit,
                  "infrastructureCommit": commit,
                  "workflowCommit": commit,
                  "workflowRef": branch,
              }

          Path("artifacts").mkdir()
          Path("artifacts/release-coordinates.json").write_text(
              json.dumps({
                  "schemaVersion": 1,
                  "version": os.environ["RELEASE_VERSION"],
                  "repositories": coordinates,
              }, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Create or reuse exact draft releases
        shell: bash
        env:
          GITHUB_APP_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          python3 eng/release-preparation.py apply \
            --coordinates artifacts/release-coordinates.json \
            --output artifacts/release-preparation.json

      - name: Retain immutable preparation
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: release-preparation-${{ inputs.version }}
          path: |
            artifacts/release-coordinates.json
            artifacts/release-preparation.json
          if-no-files-found: error
          retention-days: 90
