name: Coordinated Release Train

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      core_preview_release_id:
        description: Prepared, published Core preview release ID to resume
        required: true
        type: string

run-name: Coordinated release ${{ github.event.release.tag_name || inputs.core_preview_release_id }}

permissions:
  contents: read

concurrency:
  group: coordinated-release-${{ github.event.release.id || inputs.core_preview_release_id }}
  cancel-in-progress: false

jobs:
  release:
    if: github.event_name == 'workflow_dispatch' || github.event.release.prerelease == true
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Check out release coordinator
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Create preparation App token
        id: preparation-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: zion-sati
          repositories: |
            NetWasm
            TUnit-NetWasm
            NetWasm.Libraries
            NetWasm.Playground
            netwasm.com

      - name: Verify the intentional start release
        shell: bash
        env:
          GITHUB_APP_TOKEN: ${{ steps.preparation-token.outputs.token }}
          RELEASE_ID: ${{ github.event.release.id || inputs.core_preview_release_id }}
        run: |
          mkdir -p artifacts/receipts
          python3 eng/release-orchestrator.py prepare-start \
            --release-id "$RELEASE_ID" \
            --output artifacts/release-preparation.json

      - name: Create Core preview App token
        id: core-preview-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: zion-sati
          repositories: |
            NetWasm
            TUnit-NetWasm
            NetWasm.Libraries

      - name: Publish Core preview packages
        shell: bash
        env:
          GITHUB_APP_TOKEN: ${{ steps.core-preview-token.outputs.token }}
          RELEASE_APP_ACTOR_ID: ${{ vars.RELEASE_APP_ACTOR_ID }}
        run: |
          python3 eng/release-orchestrator.py stage \
            --preparation artifacts/release-preparation.json \
            --stage core-preview \
            --approved-actor-id "$RELEASE_APP_ACTOR_ID" \
            --output artifacts/receipts/publication-receipt-core-preview.json

      - name: Create Core stable App token
        id: core-stable-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: zion-sati
          repositories: |
            NetWasm
            TUnit-NetWasm
            NetWasm.Libraries

      - name: Publish Core stable packages
        shell: bash
        env:
          GITHUB_APP_TOKEN: ${{ steps.core-stable-token.outputs.token }}
          RELEASE_APP_ACTOR_ID: ${{ vars.RELEASE_APP_ACTOR_ID }}
        run: |
          python3 eng/release-orchestrator.py stage \
            --preparation artifacts/release-preparation.json \
            --stage core-stable \
            --approved-actor-id "$RELEASE_APP_ACTOR_ID" \
            --output artifacts/receipts/publication-receipt-core-stable.json

      - name: Create TUnit preview App token
        id: tunit-preview-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: zion-sati
          repositories: |
            NetWasm
            TUnit-NetWasm
            NetWasm.Libraries

      - name: Publish TUnit preview packages
        shell: bash
        env:
          GITHUB_APP_TOKEN: ${{ steps.tunit-preview-token.outputs.token }}
          RELEASE_APP_ACTOR_ID: ${{ vars.RELEASE_APP_ACTOR_ID }}
        run: |
          python3 eng/release-orchestrator.py stage \
            --preparation artifacts/release-preparation.json \
            --stage tunit-preview \
            --approved-actor-id "$RELEASE_APP_ACTOR_ID" \
            --output artifacts/receipts/publication-receipt-tunit-preview.json

      - name: Create TUnit stable App token
        id: tunit-stable-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: zion-sati
          repositories: |
            NetWasm
            TUnit-NetWasm
            NetWasm.Libraries

      - name: Publish TUnit stable packages
        shell: bash
        env:
          GITHUB_APP_TOKEN: ${{ steps.tunit-stable-token.outputs.token }}
          RELEASE_APP_ACTOR_ID: ${{ vars.RELEASE_APP_ACTOR_ID }}
        run: |
          python3 eng/release-orchestrator.py stage \
            --preparation artifacts/release-preparation.json \
            --stage tunit-stable \
            --approved-actor-id "$RELEASE_APP_ACTOR_ID" \
            --output artifacts/receipts/publication-receipt-tunit-stable.json

      - name: Create Libraries preview App token
        id: libraries-preview-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: zion-sati
          repositories: |
            NetWasm
            TUnit-NetWasm
            NetWasm.Libraries

      - name: Publish Libraries preview packages
        shell: bash
        env:
          GITHUB_APP_TOKEN: ${{ steps.libraries-preview-token.outputs.token }}
          RELEASE_APP_ACTOR_ID: ${{ vars.RELEASE_APP_ACTOR_ID }}
        run: |
          python3 eng/release-orchestrator.py stage \
            --preparation artifacts/release-preparation.json \
            --stage libraries-preview \
            --approved-actor-id "$RELEASE_APP_ACTOR_ID" \
            --output artifacts/receipts/publication-receipt-libraries-preview.json

      - name: Create Libraries stable App token
        id: libraries-stable-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: zion-sati
          repositories: |
            NetWasm
            TUnit-NetWasm
            NetWasm.Libraries

      - name: Publish Libraries stable packages
        shell: bash
        env:
          GITHUB_APP_TOKEN: ${{ steps.libraries-stable-token.outputs.token }}
          RELEASE_APP_ACTOR_ID: ${{ vars.RELEASE_APP_ACTOR_ID }}
        run: |
          python3 eng/release-orchestrator.py stage \
            --preparation artifacts/release-preparation.json \
            --stage libraries-stable \
            --approved-actor-id "$RELEASE_APP_ACTOR_ID" \
            --output artifacts/receipts/publication-receipt-libraries-stable.json

      - name: Retain coordinator evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: coordinated-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 90
