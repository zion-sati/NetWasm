name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  actions: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  impact:
    name: Classify change impact
    runs-on: ubuntu-24.04
    outputs:
      scope: ${{ steps.classify.outputs.scope }}
      base: ${{ steps.classify.outputs.base }}
      head: ${{ steps.classify.outputs.head }}
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Classify trusted diff
        id: classify
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          PULL_REQUEST_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GITHUB_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          head="$(git rev-parse HEAD)"
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base="$PULL_REQUEST_BASE_SHA"
          else
            base="$BEFORE_SHA"
          fi
          scope=full
          if [[ "$EVENT_NAME" == "push" && "${GITHUB_REF:-}" == "refs/heads/main" ]]; then
            if qualification_run="$(python3 eng/ci-qualification.py find \
              --repository "$REPOSITORY" \
              --workflow .github/workflows/ci.yml)"; then
              scope=reuse
              echo "Reusing full qualification from workflow run $qualification_run."
            fi
          fi
          if [[ "$scope" != "reuse" && "$base" =~ ^[0-9a-f]{40}$ && ! "$base" =~ ^0+$ ]] &&
             git cat-file -e "$base^{commit}"; then
            scope="$(python3 eng/classify-ci-impact.py --base "$base" --head "$head")"
          fi
          case "$scope" in
            docs|ci|full|reuse) ;;
            *) echo "Unsupported CI impact scope: $scope" >&2; exit 1 ;;
          esac
          {
            echo "scope=$scope"
            echo "base=$base"
            echo "head=$head"
          } >> "$GITHUB_OUTPUT"
          echo "CI impact: $scope"

  docs:
    name: Documentation
    needs: impact
    if: needs.impact.outputs.scope == 'docs'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Verify documentation change
        shell: bash
        env:
          BASE_SHA: ${{ needs.impact.outputs.base }}
          HEAD_SHA: ${{ needs.impact.outputs.head }}
        run: |
          git diff --check "$BASE_SHA" "$HEAD_SHA"
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest eng/tests/test_classify_ci_impact.py
          python3 eng/classify-ci-impact.py \
            --base "$BASE_SHA" --head "$HEAD_SHA" --verify-docs

  ci-infrastructure:
    name: CI infrastructure
    needs: impact
    if: needs.impact.outputs.scope == 'ci'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Resolve rehearsal revisions
        id: rehearsal-revisions
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          revisions = json.loads(Path("eng/release-rehearsal-revisions.json").read_text())
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              output.write(f"playground={revisions['zion-sati/NetWasm.Playground']}\n")
              output.write(f"website={revisions['zion-sati/netwasm.com']}\n")
          PY
      - name: Check out pinned Playground source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: zion-sati/NetWasm.Playground
          ref: ${{ steps.rehearsal-revisions.outputs.playground }}
          path: release-rehearsal/NetWasm.Playground
          persist-credentials: false
      - name: Check out pinned website source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: zion-sati/netwasm.com
          ref: ${{ steps.rehearsal-revisions.outputs.website }}
          path: release-rehearsal/netwasm.com
          persist-credentials: false
      - name: Verify CI infrastructure change
        shell: bash
        env:
          BASE_SHA: ${{ needs.impact.outputs.base }}
          HEAD_SHA: ${{ needs.impact.outputs.head }}
        run: |
          git diff --check "$BASE_SHA" "$HEAD_SHA"
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest \
            eng/tests/test_ci_qualification.py \
            eng/tests/test_classify_ci_impact.py \
            eng/tests/test_create_compiler_test_shard_filter.py \
            eng/tests/test_merge_compiler_test_timings.py \
            eng/tests/test_publish_release_packages.py \
            eng/tests/test_release_coordinator.py \
            eng/tests/test_release_orchestrator.py \
            eng/tests/test_release_preparation.py \
            eng/tests/test_release_receiver.py \
            eng/tests/test_release_train.py \
            eng/tests/test_resolve_release.py \
            eng/tests/test_verify_release_ci.py \
            eng/tests/test_verify_release_packages.py \
            eng/tests/test_verify_ci_results.py
          python3 -m json.tool eng/compiler-test-durations.json >/dev/null
      - name: Rehearse the coordinated release train
        shell: bash
        run: |
          python3 eng/release-rehearsal.py \
            --playground-root release-rehearsal/NetWasm.Playground \
            --website-root release-rehearsal/netwasm.com \
            --revisions eng/release-rehearsal-revisions.json \
            --core-revision "$GITHUB_SHA" \
            --verify-determinism \
            --output "$RUNNER_TEMP/release-rehearsal.json"
      - name: Retain release rehearsal transcript
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: release-rehearsal-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-rehearsal.json
          if-no-files-found: error
          retention-days: 14

  test:
    name: Test / ${{ matrix.lane }}
    needs: impact
    if: needs.impact.outputs.scope == 'full'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: remaining projects
            compiler-shard: -1
          - lane: compiler 1 of 8
            compiler-shard: 0
          - lane: compiler 2 of 8
            compiler-shard: 1
          - lane: compiler 3 of 8
            compiler-shard: 2
          - lane: compiler 4 of 8
            compiler-shard: 3
          - lane: compiler 5 of 8
            compiler-shard: 4
          - lane: compiler 6 of 8
            compiler-shard: 5
          - lane: compiler 7 of 8
            compiler-shard: 6
          - lane: compiler 8 of 8
            compiler-shard: 7
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Install .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json

      - name: Read pinned .NET 11 SDK
        id: csharp15
        shell: bash
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          print(f"sdk={json.loads(Path('eng/csharp15-toolchain.json').read_text())['sdk11Version']}")
          PY

      - name: Install pinned .NET 11 SDK for C# 15 fixtures
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: ${{ steps.csharp15.outputs.sdk }}

      - name: Read pinned Node.js version
        id: toolchain
        shell: bash
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path

          manifest = json.loads(Path("eng/toolchain.json").read_text())
          print(f"node={manifest['node']}")
          print(f"emscripten={manifest['emscripten']}")
          PY

      - name: Install Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ steps.toolchain.outputs.node }}
          package-manager-cache: false

      - name: Install pinned Emscripten
        shell: bash
        run: |
          git clone --depth 1 --branch "${{ steps.toolchain.outputs.emscripten }}" https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/emsdk"
          "$RUNNER_TEMP/emsdk/emsdk" install "${{ steps.toolchain.outputs.emscripten }}"
          "$RUNNER_TEMP/emsdk/emsdk" activate "${{ steps.toolchain.outputs.emscripten }}"

      - name: Install pinned wasm-tools
        shell: bash
        run: |
          archive="$RUNNER_TEMP/wasm-tools-1.256.0-x86_64-linux.tar.gz"
          curl --fail --silent --show-error --location \
            --retry 3 --retry-all-errors \
            --output "$archive" \
            https://github.com/bytecodealliance/wasm-tools/releases/download/v1.256.0/wasm-tools-1.256.0-x86_64-linux.tar.gz
          printf '%s  %s\n' \
            '0b488be25c9e8a74dfa09f7eac614a927ea197f389d8fa5a21ffb1c15deb469d' \
            "$archive" | sha256sum --check --strict
          mkdir "$RUNNER_TEMP/wasm-tools"
          tar --extract --gzip --file "$archive" \
            --directory "$RUNNER_TEMP/wasm-tools" \
            --strip-components=1
          echo "$RUNNER_TEMP/wasm-tools" >> "$GITHUB_PATH"

      - name: Prepare compiler qualification inputs
        shell: bash
        run: bash eng/prepare-compiler-qualification-inputs.sh "$RUNNER_TEMP/compiler-qualification"

      - name: Build and test remaining projects
        if: matrix.compiler-shard == -1
        shell: bash
        env:
          NETWASM_CORPUS_PROFILE: Fast
          NETWASM_CORPUS_RECEIPTS: ${{ runner.temp }}/compiler-qualification/linked-receipts
          NETWASM_COMPATIBILITY_REFERENCE_ROOT: ${{ runner.temp }}/compiler-qualification/compatibility-references
          NETWASM_EMSDK_ROOT: ${{ runner.temp }}/emsdk
          NETWASM_WASM_TOOLS_PATH: ${{ runner.temp }}/wasm-tools/wasm-tools
        run: |
          source "$RUNNER_TEMP/emsdk/emsdk_env.sh"
          export PATH="$RUNNER_TEMP/emsdk/upstream/bin:$PATH"
          NETWASM_NODE_PATH="$(command -v node)"
          export NETWASM_NODE_PATH
          npm ci --ignore-scripts --no-audit --no-fund
          bash eng/verify-toolchain.sh
          bash src/NetWasm.Runtime.Pack/tools/regenerate-runtime-pack.sh --allow-emscripten
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s eng/tests -p 'test_*.py'
          dotnet restore NetWasm.slnx --disable-build-servers --nologo
          dotnet build NetWasm.slnx -c Release --no-restore --disable-build-servers --nologo
          NETWASM_TIMEZONE_ASSET_PATH="$(
            bash eng/prepare-timezone-test-asset.sh "$RUNNER_TEMP/timezone-assets"
          )"
          export NETWASM_TIMEZONE_ASSET_PATH
          dotnet test NetWasm.slnx -c Release --no-build --no-restore \
            --disable-build-servers --nologo \
            --filter 'FullyQualifiedName!~NetWasm.Compiler.Tests.'

      - name: Build compiler test binaries
        if: matrix.compiler-shard != -1
        shell: bash
        env:
          NETWASM_CORPUS_PROFILE: Fast
          NETWASM_CORPUS_RECEIPTS: ${{ runner.temp }}/compiler-qualification/linked-receipts
          NETWASM_COMPATIBILITY_REFERENCE_ROOT: ${{ runner.temp }}/compiler-qualification/compatibility-references
          NETWASM_EMSDK_ROOT: ${{ runner.temp }}/emsdk
          NETWASM_WASM_TOOLS_PATH: ${{ runner.temp }}/wasm-tools/wasm-tools
        run: |
          source "$RUNNER_TEMP/emsdk/emsdk_env.sh"
          export PATH="$RUNNER_TEMP/emsdk/upstream/bin:$PATH"
          NETWASM_NODE_PATH="$(command -v node)"
          export NETWASM_NODE_PATH
          npm ci --ignore-scripts --no-audit --no-fund
          bash eng/verify-toolchain.sh
          bash src/NetWasm.Runtime.Pack/tools/regenerate-runtime-pack.sh --allow-emscripten
          project=tests/NetWasm.Compiler.Tests/NetWasm.Compiler.Tests.csproj
          corelib_project=src/NetWasm.CoreLib/NetWasm.CoreLib.csproj
          timezone_project=tools/NetWasm.TimeZones/NetWasm.TimeZones.csproj
          dotnet restore "$project" --disable-build-servers --nologo
          dotnet restore "$corelib_project" --disable-build-servers --nologo
          dotnet restore "$timezone_project" --disable-build-servers --nologo
          dotnet build "$project" -c Release --no-restore \
            --disable-build-servers --nologo
          dotnet build "$corelib_project" -c Release --no-restore \
            --disable-build-servers --nologo
          dotnet build "$timezone_project" -c Release --no-restore \
            --disable-build-servers --nologo
          NETWASM_TIMEZONE_ASSET_PATH="$(
            bash eng/prepare-timezone-test-asset.sh "$RUNNER_TEMP/timezone-assets"
          )"
          echo "NETWASM_TIMEZONE_ASSET_PATH=$NETWASM_TIMEZONE_ASSET_PATH" >> "$GITHUB_ENV"
      - name: Execute compiler shard
        if: matrix.compiler-shard != -1
        shell: bash
        env:
          NETWASM_CORPUS_PROFILE: Fast
          NETWASM_CORPUS_RECEIPTS: ${{ runner.temp }}/compiler-qualification/linked-receipts
          NETWASM_COMPATIBILITY_REFERENCE_ROOT: ${{ runner.temp }}/compiler-qualification/compatibility-references
          NETWASM_EMSDK_ROOT: ${{ runner.temp }}/emsdk
          NETWASM_WASM_TOOLS_PATH: ${{ runner.temp }}/wasm-tools/wasm-tools
        run: |
          source "$RUNNER_TEMP/emsdk/emsdk_env.sh"
          export PATH="$RUNNER_TEMP/emsdk/upstream/bin:$PATH"
          NETWASM_NODE_PATH="$(command -v node)"
          export NETWASM_NODE_PATH
          project=tests/NetWasm.Compiler.Tests/NetWasm.Compiler.Tests.csproj
          listing="$RUNNER_TEMP/compiler-tests.list"
          dotnet test "$project" -c Release --no-build --no-restore \
            --disable-build-servers --nologo --list-tests > "$listing"
          filter="$(
            python3 eng/create-compiler-test-shard-filter.py "$listing" \
              --shard-count 8 \
              --shard-index '${{ matrix.compiler-shard }}' \
              --timings eng/compiler-test-durations.json
          )"
          dotnet test "$project" -c Release --no-build --no-restore \
            --disable-build-servers --nologo --filter "$filter" \
            --results-directory "$RUNNER_TEMP/compiler-test-results" \
            --logger "trx;LogFileName=compiler-${{ matrix.compiler-shard }}.trx"
      - name: Retain compiler test timings
        if: ${{ always() && matrix.compiler-shard != -1 }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: compiler-test-timings-${{ matrix.compiler-shard }}
          path: ${{ runner.temp }}/compiler-test-results/*.trx
          if-no-files-found: warn
          retention-days: 14

  javascript-contracts:
    name: Test / JavaScript contracts
    needs: impact
    if: needs.impact.outputs.scope == 'full'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Read pinned Node.js version
        id: toolchain
        shell: bash
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          print(f"node={json.loads(Path('eng/toolchain.json').read_text())['node']}")
          PY
      - name: Install Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ steps.toolchain.outputs.node }}
          package-manager-cache: false
      - name: Run JavaScript contracts
        shell: bash
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx --no-install playwright install --with-deps chromium firefox webkit
          bash eng/test-javascript.sh

  package:
    needs: impact
    if: needs.impact.outputs.scope == 'full'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
      - name: Read toolchain pins
        id: toolchain
        shell: bash
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          manifest = json.loads(Path("eng/toolchain.json").read_text())
          print(f"emscripten={manifest['emscripten']}")
          print(f"wasm_tools={manifest['wasmTools']}")
          print(f"wasm_tools_sha={manifest['wasmToolsLinuxX64Sha256']}")
          PY
      - name: Install pinned native toolchain
        shell: bash
        run: |
          git clone --depth 1 --branch "${{ steps.toolchain.outputs.emscripten }}" https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/emsdk"
          "$RUNNER_TEMP/emsdk/emsdk" install "${{ steps.toolchain.outputs.emscripten }}"
          "$RUNNER_TEMP/emsdk/emsdk" activate "${{ steps.toolchain.outputs.emscripten }}"
          archive="$RUNNER_TEMP/wasm-tools.tar.gz"
          curl --fail --silent --show-error --location --retry 3 --retry-all-errors --output "$archive" \
            "https://github.com/bytecodealliance/wasm-tools/releases/download/v${{ steps.toolchain.outputs.wasm_tools }}/wasm-tools-${{ steps.toolchain.outputs.wasm_tools }}-x86_64-linux.tar.gz"
          printf '%s  %s\n' '${{ steps.toolchain.outputs.wasm_tools_sha }}' "$archive" | sha256sum --check --strict
          mkdir "$RUNNER_TEMP/wasm-tools"
          tar --extract --gzip --file "$archive" --directory "$RUNNER_TEMP/wasm-tools" --strip-components=1
          echo "$RUNNER_TEMP/wasm-tools" >> "$GITHUB_PATH"
      - name: Build candidate package graph
        id: version
        shell: bash
        run: |
          base_version="$(tr -d '[:space:]' < eng/NetWasm.ReleaseVersion.txt)"
          version="${base_version}-ci.${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}"
          echo "value=$version" >> "$GITHUB_OUTPUT"
          source "$RUNNER_TEMP/emsdk/emsdk_env.sh"
          bash eng/build-packages.sh --version "$version" --output "$RUNNER_TEMP/packages"
      - name: Retain candidate packages
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: runtime-pack-candidate
          path: ${{ runner.temp }}/packages/*.nupkg
          if-no-files-found: error
          retention-days: 14

  timings:
    name: Compiler test timings
    needs: [impact, test]
    if: needs.impact.outputs.scope == 'full'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Download compiler test timings
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: compiler-test-timings-*
          merge-multiple: true
          path: ${{ runner.temp }}/compiler-test-timings
      - name: Merge compiler test timings
        shell: bash
        run: |
          python3 eng/merge-compiler-test-timings.py \
            "$RUNNER_TEMP"/compiler-test-timings/*.trx \
            --output "$RUNNER_TEMP/compiler-test-timings.json"
      - name: Retain merged compiler test timings
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: compiler-test-timings
          path: ${{ runner.temp }}/compiler-test-timings.json
          if-no-files-found: error
          retention-days: 14

  host-tools:
    needs: impact
    if: needs.impact.outputs.scope == 'full'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            rid: linux-x64
          - runner: ubuntu-24.04-arm
            rid: linux-arm64
          - runner: macos-14
            rid: osx-arm64
          - runner: windows-2025
            rid: win-x64
          - runner: windows-11-vs2026-arm
            rid: win-arm64
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Install .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
      - name: Install Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.13'
      - name: Install pinned Linux Node patcher
        if: startsWith(matrix.rid, 'linux-')
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y patchelf=0.18.0-1.1build1
      - name: Build and verify native host package
        shell: bash
        env:
          NETWASM_GITHUB_TOKEN: ${{ github.token }}
        run: |
          base_version="$(tr -d '[:space:]' < eng/NetWasm.ReleaseVersion.txt)"
          version="${base_version}-ci.${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}"
          python eng/build-host-tools-package.py \
            --rid "${{ matrix.rid }}" \
            --version "$version" \
            --output "$RUNNER_TEMP/host-packages" \
            --cache "$RUNNER_TEMP/host-tools-inputs"
          bash eng/verify-host-tools-repeatability.sh \
            "${{ matrix.rid }}" "$version" \
            "$RUNNER_TEMP/host-tools-inputs" \
            "$RUNNER_TEMP/host-packages/NetWasm.HostTools.${{ matrix.rid }}.$version.nupkg"
      - name: Retain native host package
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: host-tools-${{ matrix.rid }}
          path: ${{ runner.temp }}/host-packages/*.nupkg
          if-no-files-found: error
          retention-days: 14

  verify-packages:
    needs: [impact, package, host-tools]
    if: needs.impact.outputs.scope == 'full'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      version: ${{ needs.package.outputs.version }}
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Install Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.13'
      - name: Download neutral packages
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: runtime-pack-candidate
          path: ${{ runner.temp }}/packages
      - name: Download native host packages
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: host-tools-*
          merge-multiple: true
          path: ${{ runner.temp }}/packages
      - name: Verify complete candidate set
        shell: bash
        env:
          CANDIDATE_VERSION: ${{ needs.package.outputs.version }}
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          manifest = json.loads(Path('eng/release-manifest.json').read_text())
          manifest['releaseVersion'] = os.environ['CANDIDATE_VERSION']
          manifest['sourceCommit'] = subprocess.check_output(
              ['git', 'rev-parse', 'HEAD'], text=True).strip()
          manifest['releaseTag'] = 'ci-' + os.environ['GITHUB_RUN_ID'] + '-' + os.environ['GITHUB_RUN_ATTEMPT']
          Path(os.environ['RUNNER_TEMP'], 'candidate-manifest.json').write_text(
              json.dumps(manifest, indent=2) + '\n')
          PY
          python eng/verify-release-packages.py \
            --manifest "$RUNNER_TEMP/candidate-manifest.json" \
            --packages "$RUNNER_TEMP/packages" \
            --pins-root .
      - name: Record immutable candidate provenance
        shell: bash
        env:
          CANDIDATE_VERSION: ${{ needs.package.outputs.version }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, subprocess
          from pathlib import Path

          event = json.loads(Path(os.environ['GITHUB_EVENT_PATH']).read_text())
          packages = {}
          for path in sorted(Path(os.environ['RUNNER_TEMP'], 'packages').glob('*.nupkg')):
              packages[path.name] = {
                  'bytes': path.stat().st_size,
                  'sha256': hashlib.sha256(path.read_bytes()).hexdigest(),
              }
          head = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          receipt = {
              'schemaVersion': 1,
              'repository': os.environ['GITHUB_REPOSITORY'],
              'pullRequest': event.get('pull_request', {}).get('number'),
              'pullRequestHead': event.get('pull_request', {}).get('head', {}).get('sha'),
              'pullRequestBase': event.get('pull_request', {}).get('base', {}).get('sha'),
              'checkedOutCommit': head,
              'checkedOutTree': subprocess.check_output(['git', 'rev-parse', f'{head}^{{tree}}'], text=True).strip(),
              'workflowRunId': os.environ['GITHUB_RUN_ID'],
              'workflowRunAttempt': os.environ['GITHUB_RUN_ATTEMPT'],
              'candidateVersion': os.environ['CANDIDATE_VERSION'],
              'sdk10Version': json.loads(Path('eng/csharp15-toolchain.json').read_text())['sdk10MinimumVersion'],
              'csharp15Toolchain': json.loads(Path('eng/csharp15-toolchain.json').read_text()),
              'nativeToolchain': json.loads(Path('eng/toolchain.json').read_text()),
              'packages': packages,
          }
          Path(os.environ['RUNNER_TEMP'], 'candidate-receipt.json').write_text(json.dumps(receipt, indent=2) + '\n')
          PY
      - name: Retain candidate provenance
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: candidate-receipt
          path: ${{ runner.temp }}/candidate-receipt.json
          if-no-files-found: error
          retention-days: 14

  runtime-pack-hosts:
    needs: [impact, verify-packages]
    if: needs.impact.outputs.scope == 'full'
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        sdk-major: [10, 11]
        host: [linux-x64, linux-arm64, macos-arm64, windows-x64, windows-arm64]
        include:
          - host: linux-x64
            runner: ubuntu-24.04
            rid: linux-x64
            architecture: x64
          - host: linux-arm64
            runner: ubuntu-24.04-arm
            rid: linux-arm64
            architecture: arm64
          - host: macos-arm64
            runner: macos-14
            rid: osx-arm64
            architecture: arm64
          - host: windows-x64
            runner: windows-2025
            rid: win-x64
            architecture: x64
          - host: windows-arm64
            runner: windows-11-vs2026-arm
            rid: win-arm64
            architecture: arm64
    runs-on: ${{ matrix.runner }}
    name: Runtime pack / ${{ matrix.host }} / SDK ${{ matrix.sdk-major }}
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Resolve isolated .NET SDK version
        id: isolated-dotnet
        shell: bash
        env:
          SDK_MAJOR: ${{ matrix.sdk-major }}
        run: |
          if [[ "$SDK_MAJOR" == 10 ]]; then
            sdk_version=$(python3 -c 'import json; print(json.load(open("eng/csharp15-toolchain.json"))["sdk10MinimumVersion"])')
          else
            sdk_version=$(python3 -c 'import json; print(json.load(open("eng/csharp15-toolchain.json"))["sdk11Version"])')
          fi
          echo "sdk-version=$sdk_version" >> "$GITHUB_OUTPUT"
      - name: Install one isolated .NET SDK and runtime (Unix)
        if: ${{ !startsWith(matrix.rid, 'win-') }}
        shell: bash
        env:
          SDK_VERSION: ${{ steps.isolated-dotnet.outputs.sdk-version }}
          DOTNET_ARCHITECTURE: ${{ matrix.architecture }}
        run: |
          curl --fail --silent --show-error --location --retry 3 --retry-all-errors \
            --output "$RUNNER_TEMP/dotnet-install.sh" https://dot.net/v1/dotnet-install.sh
          bash "$RUNNER_TEMP/dotnet-install.sh" \
            --version "$SDK_VERSION" \
            --architecture "$DOTNET_ARCHITECTURE" \
            --install-dir "$RUNNER_TEMP/dotnet-isolated" \
            --no-path
          echo "$RUNNER_TEMP/dotnet-isolated" >> "$GITHUB_PATH"
          {
            echo "DOTNET_ROOT=$RUNNER_TEMP/dotnet-isolated"
            echo "DOTNET_MULTILEVEL_LOOKUP=0"
            echo "NETWASM_QUALIFY_DOTNET_ROOT=$RUNNER_TEMP/dotnet-isolated"
          } >> "$GITHUB_ENV"
      - name: Install one isolated .NET SDK and runtime (Windows)
        if: ${{ startsWith(matrix.rid, 'win-') }}
        shell: pwsh
        env:
          SDK_VERSION: ${{ steps.isolated-dotnet.outputs.sdk-version }}
          DOTNET_ARCHITECTURE: ${{ matrix.architecture }}
        run: |
          $script = Join-Path $env:RUNNER_TEMP 'dotnet-install.ps1'
          Invoke-WebRequest -UseBasicParsing https://dot.net/v1/dotnet-install.ps1 -OutFile $script
          $root = Join-Path $env:RUNNER_TEMP 'dotnet-isolated'
          & $script -Version $env:SDK_VERSION -Architecture $env:DOTNET_ARCHITECTURE -InstallDir $root -NoPath
          $root | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "DOTNET_ROOT=$root" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "DOTNET_MULTILEVEL_LOOKUP=0" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "NETWASM_QUALIFY_DOTNET_ROOT=$root" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Download candidate packages
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: runtime-pack-candidate
          path: ${{ runner.temp }}/packages
      - name: Download matching native host package
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: host-tools-${{ matrix.rid }}
          path: ${{ runner.temp }}/packages
      - name: Download candidate provenance
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: candidate-receipt
          path: ${{ runner.temp }}
      - name: Verify consumed candidate artifacts
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path

          receipt = json.loads(Path(os.environ['RUNNER_TEMP'], 'candidate-receipt.json').read_text())
          expected_version = '${{ needs.verify-packages.outputs.version }}'
          if receipt['candidateVersion'] != expected_version:
              raise SystemExit('Candidate receipt version does not match the package job output.')
          local = sorted(Path(os.environ['RUNNER_TEMP'], 'packages').glob('*.nupkg'))
          if not local:
              raise SystemExit('Candidate package directory is empty.')
          for path in local:
              expected = receipt['packages'].get(path.name)
              actual = hashlib.sha256(path.read_bytes()).hexdigest()
              if expected is None or expected['bytes'] != path.stat().st_size or expected['sha256'] != actual:
                  raise SystemExit(f'Candidate package does not match its receipt: {path.name}')
          PY
      - name: Qualify SDK consumers with restored host tools
        shell: bash
        env:
          NETWASM_QUALIFY_SDK_VERSION: ${{ steps.isolated-dotnet.outputs.sdk-version }}
        run: |
          bash eng/qualify-sdk-consumers.sh \
            "$RUNNER_TEMP/packages" "${{ needs.verify-packages.outputs.version }}" \
            --skip-test-consumers

  ci:
    name: CI
    if: always()
    needs: [impact, docs, ci-infrastructure, test, javascript-contracts, timings, package, host-tools, verify-packages, runtime-pack-hosts]
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Verify required gates
        shell: bash
        env:
          SCOPE: ${{ needs.impact.outputs.scope }}
          IMPACT_RESULT: ${{ needs.impact.result }}
          DOCS_RESULT: ${{ needs.docs.result }}
          CI_INFRASTRUCTURE_RESULT: ${{ needs.ci-infrastructure.result }}
          TEST_RESULT: ${{ needs.test.result }}
          JAVASCRIPT_CONTRACTS_RESULT: ${{ needs.javascript-contracts.result }}
          TIMINGS_RESULT: ${{ needs.timings.result }}
          PACKAGE_RESULT: ${{ needs.package.result }}
          HOST_TOOLS_RESULT: ${{ needs.host-tools.result }}
          VERIFY_PACKAGES_RESULT: ${{ needs.verify-packages.result }}
          RUNTIME_PACK_HOSTS_RESULT: ${{ needs.runtime-pack-hosts.result }}
        run: |
          python3 eng/verify-ci-results.py \
            --scope "$SCOPE" \
            --impact "$IMPACT_RESULT" \
            --docs "$DOCS_RESULT" \
            --ci-infrastructure "$CI_INFRASTRUCTURE_RESULT" \
            --test "$TEST_RESULT" \
            --javascript-contracts "$JAVASCRIPT_CONTRACTS_RESULT" \
            --timings "$TIMINGS_RESULT" \
            --package "$PACKAGE_RESULT" \
            --host-tools "$HOST_TOOLS_RESULT" \
            --verify-packages "$VERIFY_PACKAGES_RESULT" \
            --runtime-pack-hosts "$RUNTIME_PACK_HOSTS_RESULT"
      - name: Create exact-tree qualification receipt
        if: github.event_name == 'pull_request' && needs.impact.outputs.scope == 'full'
        shell: bash
        run: |
          python3 eng/ci-qualification.py create \
            --repository "$GITHUB_REPOSITORY" \
            --event "$GITHUB_EVENT_PATH" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --workflow .github/workflows/ci.yml \
            --output "$RUNNER_TEMP/ci-qualification.json"
      - name: Retain exact-tree qualification receipt
        if: github.event_name == 'pull_request' && needs.impact.outputs.scope == 'full'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ci-qualification
          path: ${{ runner.temp }}/ci-qualification.json
          if-no-files-found: error
          retention-days: 14
