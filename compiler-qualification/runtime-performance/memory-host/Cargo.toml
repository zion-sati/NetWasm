[package]
name = "netwasm-memory-host"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "netwasm-memory-host"
path = "src/main.rs"

[dependencies]
wasmtime = { version = "=50.0.1", default-features = false, features = ["async", "component-model", "component-model-async", "cranelift", "gc", "gc-null", "runtime", "std"] }
wasmtime-wasi = { version = "=50.0.1", default-features = false, features = ["p2", "p3"] }
tokio = { version = "1.53.1", default-features = false, features = ["rt"] }
