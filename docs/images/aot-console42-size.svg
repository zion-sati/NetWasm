<svg role="img" aria-labelledby="chart-title chart-description"
     xmlns="http://www.w3.org/2000/svg" width="960" height="548" viewBox="0 0 960 548">
  <title id="chart-title">AOT Wasm payload: NetWasm is 181 times smaller</title>
  <desc id="chart-description">Zero-based linear scale in megabytes, using 1024 bytes per kilobyte and 1024 kilobytes per megabyte. NetWasm is 82.7 kilobytes. Blazor .NET 10 is 11.71 megabytes. Blazor .NET 11 RC1 is 14.58 megabytes. All measurements are uncompressed.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="960" y2="548" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#080b10"/>
      <stop offset="1" stop-color="#101522"/>
    </linearGradient>
    <linearGradient id="netwasm-bar" x1="90" y1="0" x2="170" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#67e8f9"/>
    </linearGradient>
    <linearGradient id="dotnet10-bar" x1="90" y1="0" x2="661" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4c3a78"/>
      <stop offset="1" stop-color="#8b6bc7"/>
    </linearGradient>
    <linearGradient id="dotnet11-bar" x1="90" y1="0" x2="801" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6947c6"/>
      <stop offset="1" stop-color="#b19aff"/>
    </linearGradient>
    <filter id="bar-shadow" x="-10%" y="-40%" width="120%" height="180%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <style>
      text { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .muted { fill: #99a3b3; }
      .label { fill: #f4f6fa; font-size: 18px; font-weight: 700; }
      .value { fill: #d9deea; font-size: 16px; font-weight: 650; text-anchor: end; }
      .tick { fill: #808b9d; font-size: 13px; text-anchor: middle; }
      .grid { stroke: #29313e; stroke-width: 1; }
    </style>
  </defs>

  <rect width="960" height="548" rx="20" fill="url(#background)"/>

  <text x="90" y="48" class="muted" font-size="15">Console.WriteLine(42)  /  AOT vs AOT</text>
  <text x="90" y="106" fill="#b19aff" font-size="50" font-weight="800">181× smaller</text>
  <text x="90" y="139" fill="#f4f6fa" font-size="16">NetWasm vs .NET 11 Blazor WebAssembly AOT</text>
  <g transform="translate(748 61)">
    <rect width="122" height="32" rx="16" fill="#211a3a" stroke="#4f3d81"/>
    <text x="61" y="21" fill="#c9b9ff" font-size="13" font-weight="700" text-anchor="middle">Lower is better</text>
  </g>

  <g aria-hidden="true">
    <line x1="90" y1="179" x2="90" y2="465" class="grid"/>
    <line x1="285" y1="179" x2="285" y2="465" class="grid"/>
    <line x1="480" y1="179" x2="480" y2="465" class="grid"/>
    <line x1="675" y1="179" x2="675" y2="465" class="grid"/>
    <line x1="870" y1="179" x2="870" y2="465" class="grid"/>
  </g>

  <text x="90" y="205" fill="#38d9ea" font-size="18" font-weight="750">NetWasm</text>
  <text x="870" y="205" fill="#67e8f9" class="value">82.7 KB</text>
  <rect x="90" y="219" width="4" height="42" rx="2" fill="url(#netwasm-bar)" stroke="#67e8f9" filter="url(#bar-shadow)"/>

  <text x="90" y="300" class="label">Blazor  /  .NET 10</text>
  <text x="870" y="300" class="value">11.71 MB</text>
  <rect x="90" y="314" width="571" height="42" rx="7" fill="url(#dotnet10-bar)" stroke="#8b6bc7" filter="url(#bar-shadow)"/>

  <text x="90" y="395" class="label">Blazor  /  .NET 11 RC1</text>
  <text x="870" y="395" class="value">14.58 MB</text>
  <rect x="90" y="409" width="711" height="42" rx="7" fill="url(#dotnet11-bar)" stroke="#b19aff" filter="url(#bar-shadow)"/>

  <line x1="90" y1="465" x2="870" y2="465" stroke="#586273"/>
  <text x="90" y="487" class="tick">0</text>
  <text x="285" y="487" class="tick">4</text>
  <text x="480" y="487" class="tick">8</text>
  <text x="675" y="487" class="tick">12</text>
  <text x="870" y="487" class="tick">16</text>
  <text x="895" y="487" class="muted" font-size="13">MB</text>

  <text x="90" y="522" class="muted" font-size="13">Uncompressed Wasm · NetWasm includes runtime, GC and WASI · No JavaScript counted</text>
</svg>
