<svg role="img" aria-labelledby="chart-title chart-description"
     xmlns="http://www.w3.org/2000/svg" width="960" height="880" viewBox="0 0 960 880">
  <title id="chart-title">Wasm footprint landscape: C# with precise GC is smallest raw and after Brotli 11</title>
  <desc id="chart-description">Zero-based size comparison for programs that print 42. NetWasm with precise Compact garbage collection is 28,377 raw and 11,880 Brotli-11 bytes. Rust 1.100.0 is 63,528 raw and 19,519 compressed bytes. These are matched WASI 0.3 components. For context, Rust 1.100.0's WASI 0.2 component is 53,382 raw and 16,725 compressed bytes. Kotlin 2.4 is 79,293 raw and 22,655 compressed bytes. TinyGo 0.39 is 93,043 raw and 26,931 compressed bytes. Kotlin and TinyGo are contextual WASI Preview 1 references.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="960" y2="880" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#080b10"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="netwasm-bar" x1="90" y1="0" x2="306" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#06b6d4"/>
      <stop offset="1" stop-color="#67e8f9"/>
    </linearGradient>
    <linearGradient id="rust-bar" x1="90" y1="0" x2="574" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#b45309"/>
      <stop offset="1" stop-color="#fbbf24"/>
    </linearGradient>
    <linearGradient id="context-bar" x1="90" y1="0" x2="799" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#475569"/>
      <stop offset="1" stop-color="#94a3b8"/>
    </linearGradient>
    <pattern id="context-pattern" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="url(#context-bar)"/>
      <path d="M0 0V8" stroke="#cbd5e1" stroke-opacity="0.22" stroke-width="2"/>
    </pattern>
    <filter id="bar-shadow" x="-10%" y="-60%" width="120%" height="220%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.38"/>
    </filter>
    <style>
      text { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .muted { fill: #94a3b8; }
      .label { fill: #f8fafc; font-size: 17px; font-weight: 700; }
      .context-label { fill: #cbd5e1; font-size: 17px; font-weight: 650; }
      .value { fill: #e2e8f0; font-size: 15px; font-weight: 700; text-anchor: end; }
      .compressed-value { fill: #a5b4c8; font-size: 12px; font-weight: 650; text-anchor: end; }
      .tick { fill: #7c8ba1; font-size: 12px; text-anchor: middle; }
      .grid { stroke: #273244; stroke-width: 1; }
    </style>
  </defs>

  <rect width="960" height="880" rx="22" fill="url(#background)"/>

  <text x="90" y="46" class="muted" font-size="15">PRINTING 42  /  RAW + BROTLI 11  /  LOWER IS BETTER</text>
  <text x="90" y="103" fill="#67e8f9" font-size="48" font-weight="820">C# + precise GC</text>
  <text x="90" y="147" fill="#f8fafc" font-size="30" font-weight="760">smallest raw and compressed</text>
  <g transform="translate(738 72)">
    <rect width="92" height="32" rx="16" fill="#12303a" stroke="#1e6573"/>
    <text x="46" y="21" fill="#a5f3fc" font-size="13" font-weight="700" text-anchor="middle">NetWasm</text>
  </g>

  <g transform="translate(90 170)">
    <rect width="32" height="12" rx="4" fill="#64748b"/>
    <text x="42" y="11" class="muted" font-size="12">raw Wasm</text>
    <rect x="130" y="3" width="32" height="6" rx="3" fill="#e2e8f0"/>
    <text x="172" y="11" class="muted" font-size="12">Brotli 11</text>
  </g>

  <text x="90" y="215" fill="#67e8f9" font-size="12" font-weight="800" letter-spacing="1.7">MATCHED WASI 0.3 COMPONENTS</text>

  <g aria-hidden="true">
    <line x1="90" y1="228" x2="90" y2="807" class="grid"/>
    <line x1="285" y1="228" x2="285" y2="807" class="grid"/>
    <line x1="480" y1="228" x2="480" y2="807" class="grid"/>
    <line x1="675" y1="228" x2="675" y2="807" class="grid"/>
    <line x1="870" y1="228" x2="870" y2="807" class="grid"/>
  </g>

  <text x="90" y="250" fill="#67e8f9" class="label">NetWasm  /  Compact GC</text>
  <text x="870" y="250" fill="#a5f3fc" class="value">28,377 B raw</text>
  <rect x="90" y="262" width="216" height="28" rx="6" fill="url(#netwasm-bar)" stroke="#67e8f9" filter="url(#bar-shadow)"/>
  <rect x="90" y="298" width="90" height="8" rx="4" fill="#ecfeff"/>
  <text x="870" y="306" class="compressed-value">11,880 B Brotli 11</text>

  <text x="90" y="350" fill="#fbbf24" class="label">Rust 1.100  /  size profile</text>
  <text x="870" y="350" fill="#fde68a" class="value">63,528 B raw</text>
  <rect x="90" y="362" width="484" height="28" rx="6" fill="url(#rust-bar)" stroke="#fbbf24" filter="url(#bar-shadow)"/>
  <rect x="90" y="398" width="149" height="8" rx="4" fill="#fef3c7"/>
  <text x="870" y="406" class="compressed-value">19,519 B Brotli 11</text>

  <line x1="90" y1="425" x2="870" y2="425" stroke="#334155"/>
  <text x="90" y="451" fill="#a08a63" font-size="12" font-weight="800" letter-spacing="1.7">CONTEXT  /  WASI 0.2</text>

  <text x="90" y="487" class="context-label" style="fill:#a08a63">Rust 1.100  /  size profile</text>
  <text x="870" y="487" class="value" style="fill:#a08a63">53,382 B raw</text>
  <rect x="90" y="499" width="407" height="28" rx="6" fill="#4a3d27" stroke="#7d6844" stroke-dasharray="5 4"/>
  <rect x="90" y="535" width="127" height="8" rx="4" fill="#8a7653"/>
  <text x="870" y="543" class="compressed-value" style="fill:#8a7653">16,725 B Brotli 11</text>

  <line x1="90" y1="572" x2="870" y2="572" stroke="#334155"/>
  <text x="90" y="598" fill="#7d889b" font-size="12" font-weight="800" letter-spacing="1.7">CONTEXT  /  WASI PREVIEW 1</text>

  <text x="90" y="634" class="context-label" style="fill:#8f9bb0">Kotlin 2.4  /  wasmWasi</text>
  <text x="870" y="634" class="value" style="fill:#8f9bb0">79,293 B raw</text>
  <rect x="90" y="646" width="604" height="28" rx="6" fill="url(#context-pattern)" opacity="0.55"/>
  <rect x="90" y="682" width="173" height="8" rx="4" fill="#7d889b"/>
  <text x="870" y="690" class="compressed-value" style="fill:#7d889b">22,655 B Brotli 11</text>

  <text x="90" y="734" class="context-label" style="fill:#8f9bb0">TinyGo 0.39  /  precise GC</text>
  <text x="870" y="734" class="value" style="fill:#8f9bb0">93,043 B raw</text>
  <rect x="90" y="746" width="709" height="28" rx="6" fill="url(#context-pattern)" opacity="0.55"/>
  <rect x="90" y="782" width="205" height="8" rx="4" fill="#7d889b"/>
  <text x="870" y="790" class="compressed-value" style="fill:#7d889b">26,931 B Brotli 11</text>

  <line x1="90" y1="807" x2="870" y2="807" stroke="#586273"/>
  <text x="90" y="828" class="tick">0</text>
  <text x="285" y="828" class="tick">25</text>
  <text x="480" y="828" class="tick">50</text>
  <text x="675" y="828" class="tick">75</text>
  <text x="870" y="828" class="tick">100 KiB</text>
  <text x="90" y="855" class="muted" font-size="11">Rust's WASI 0.3 build is the matched reference. Its WASI 0.2 build, Kotlin and TinyGo use other targets; see methodology.</text>
</svg>
