<svg role="img" aria-labelledby="chart-title chart-description"
     xmlns="http://www.w3.org/2000/svg" width="960" height="740" viewBox="0 0 960 740">
  <title id="chart-title">Wasm footprint landscape: C# with precise GC is smallest raw and after Brotli 11</title>
  <desc id="chart-description">Zero-based size comparison for programs that print 42. NetWasm with precise Compact garbage collection is 37,390 raw and 12,631 Brotli-11 bytes. Rust 1.95.0 is 53,635 raw and 16,963 compressed bytes. These are matched WASI Preview 2 components. Kotlin 2.4 is 79,293 raw and 22,655 compressed bytes. TinyGo 0.39 is 93,043 raw and 26,931 compressed bytes. Kotlin and TinyGo are contextual WASI Preview 1 references.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="960" y2="740" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#080b10"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="netwasm-bar" x1="90" y1="0" x2="418" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#06b6d4"/>
      <stop offset="1" stop-color="#67e8f9"/>
    </linearGradient>
    <linearGradient id="rust-bar" x1="90" y1="0" x2="499" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#b45309"/>
      <stop offset="1" stop-color="#fbbf24"/>
    </linearGradient>
    <linearGradient id="context-bar" x1="90" y1="0" x2="799" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#475569"/>
      <stop offset="1" stop-color="#94a3b8"/>
    </linearGradient>
    <pattern id="context-pattern" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="url(#context-bar)"/>
      <path d="M0 0V8" stroke="#cbd5e1" stroke-opacity="0.22" stroke-width="2"/>
    </pattern>
    <filter id="bar-shadow" x="-10%" y="-60%" width="120%" height="220%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.38"/>
    </filter>
    <style>
      text { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .muted { fill: #94a3b8; }
      .label { fill: #f8fafc; font-size: 17px; font-weight: 700; }
      .context-label { fill: #cbd5e1; font-size: 17px; font-weight: 650; }
      .value { fill: #e2e8f0; font-size: 15px; font-weight: 700; text-anchor: end; }
      .compressed-value { fill: #a5b4c8; font-size: 12px; font-weight: 650; text-anchor: end; }
      .tick { fill: #7c8ba1; font-size: 12px; text-anchor: middle; }
      .grid { stroke: #273244; stroke-width: 1; }
    </style>
  </defs>

  <rect width="960" height="740" rx="22" fill="url(#background)"/>

  <text x="90" y="46" class="muted" font-size="15">PRINTING 42  /  RAW + BROTLI 11  /  LOWER IS BETTER</text>
  <text x="90" y="103" fill="#67e8f9" font-size="48" font-weight="820">C# + precise GC</text>
  <text x="90" y="147" fill="#f8fafc" font-size="30" font-weight="760">smallest raw and compressed</text>
  <g transform="translate(738 72)">
    <rect width="92" height="32" rx="16" fill="#12303a" stroke="#1e6573"/>
    <text x="46" y="21" fill="#a5f3fc" font-size="13" font-weight="700" text-anchor="middle">NetWasm</text>
  </g>

  <g transform="translate(90 170)">
    <rect width="32" height="12" rx="4" fill="#64748b"/>
    <text x="42" y="11" class="muted" font-size="12">raw Wasm</text>
    <rect x="130" y="3" width="32" height="6" rx="3" fill="#e2e8f0"/>
    <text x="172" y="11" class="muted" font-size="12">Brotli 11</text>
  </g>

  <text x="90" y="215" fill="#67e8f9" font-size="12" font-weight="800" letter-spacing="1.7">MATCHED WASI PREVIEW 2 COMPONENTS</text>

  <g aria-hidden="true">
    <line x1="90" y1="228" x2="90" y2="670" class="grid"/>
    <line x1="285" y1="228" x2="285" y2="670" class="grid"/>
    <line x1="480" y1="228" x2="480" y2="670" class="grid"/>
    <line x1="675" y1="228" x2="675" y2="670" class="grid"/>
    <line x1="870" y1="228" x2="870" y2="670" class="grid"/>
  </g>

  <text x="90" y="250" fill="#67e8f9" class="label">NetWasm  /  Compact GC</text>
  <text x="870" y="250" fill="#a5f3fc" class="value">37,390 B raw</text>
  <rect x="90" y="262" width="285" height="28" rx="6" fill="url(#netwasm-bar)" stroke="#67e8f9" filter="url(#bar-shadow)"/>
  <rect x="90" y="298" width="96" height="8" rx="4" fill="#ecfeff"/>
  <text x="870" y="306" class="compressed-value">12,631 B Brotli 11</text>

  <text x="90" y="350" fill="#fbbf24" class="label">Rust 1.95  /  size profile</text>
  <text x="870" y="350" fill="#fde68a" class="value">53,635 B raw</text>
  <rect x="90" y="362" width="409" height="28" rx="6" fill="url(#rust-bar)" stroke="#fbbf24" filter="url(#bar-shadow)"/>
  <rect x="90" y="398" width="129" height="8" rx="4" fill="#fef3c7"/>
  <text x="870" y="406" class="compressed-value">16,963 B Brotli 11</text>

  <line x1="90" y1="435" x2="870" y2="435" stroke="#334155"/>
  <text x="90" y="461" fill="#94a3b8" font-size="12" font-weight="800" letter-spacing="1.7">BROADER FOOTPRINT CONTEXT  /  WASI PREVIEW 1</text>

  <text x="90" y="497" class="context-label">Kotlin 2.4  /  wasmWasi</text>
  <text x="870" y="497" class="value">79,293 B raw</text>
  <rect x="90" y="509" width="604" height="28" rx="6" fill="url(#context-pattern)" opacity="0.8"/>
  <rect x="90" y="545" width="173" height="8" rx="4" fill="#cbd5e1" opacity="0.9"/>
  <text x="870" y="553" class="compressed-value">22,655 B Brotli 11</text>

  <text x="90" y="597" class="context-label">TinyGo 0.39  /  precise GC</text>
  <text x="870" y="597" class="value">93,043 B raw</text>
  <rect x="90" y="609" width="709" height="28" rx="6" fill="url(#context-pattern)" opacity="0.8"/>
  <rect x="90" y="645" width="205" height="8" rx="4" fill="#cbd5e1" opacity="0.9"/>
  <text x="870" y="653" class="compressed-value">26,931 B Brotli 11</text>

  <line x1="90" y1="670" x2="870" y2="670" stroke="#586273"/>
  <text x="90" y="691" class="tick">0</text>
  <text x="285" y="691" class="tick">25</text>
  <text x="480" y="691" class="tick">50</text>
  <text x="675" y="691" class="tick">75</text>
  <text x="870" y="691" class="tick">100 KiB</text>
  <text x="90" y="718" class="muted" font-size="11">Rust is the matched reference. Kotlin and TinyGo use different target/runtime boundaries; see methodology.</text>
</svg>
